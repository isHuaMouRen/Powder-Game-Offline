<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Powder Game - 本地版</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      background: #ece4d1;
      color: #241b13;
    }

    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 0.75rem;
    }

    h1, p {
      margin: 0;
    }

    main {
      width: min(100%, 400px);
      text-align: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 400 / 456;
      image-rendering: pixelated;
      touch-action: none;
    }

    #game:fullscreen {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 1rem;
      display: grid;
      place-content: center;
      background: #ece4d1;
    }

    #game:fullscreen canvas {
      width: min(100%, 400px);
      max-height: calc(100vh - 5rem);
    }

    button {
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }

    .credit {
      font-size: 0.8rem;
      color: #514538;
    }
  </style>
</head>
<body>
  <h1>Powder Game</h1>
  <p>本地运行，无需联网。点击或拖动鼠标开始游玩。</p>
  <main id="game">
    <canvas id="cv" width="400" height="456" aria-label="Powder Game simulation"></canvas>
    <button id="fullscreen" type="button">全屏</button>
  </main>
  <p class="credit">Powder Game © 2007 ha55ii / DAN-BALL</p>
  <a href="https://github.com/isHuaMouRen/Powder-Game-Offline" class="credit">https://github.com/isHuaMouRen/Powder-Game-Offline</p>
  <script src="./javagame/dust/dust.js"></script>
  <script>
    // The authorized offline copy should not be blocked by the original domain check.
    window.zb = function () {
      window.Ob = 0;
      window.zf = 11;
      return false;
    };
    Init("", 1, "");

    document.getElementById("fullscreen").addEventListener("click", async function () {
      const game = document.getElementById("game");
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else if (game.requestFullscreen) {
        await game.requestFullscreen();
      }
    });
  </script>
</body>
</html>
