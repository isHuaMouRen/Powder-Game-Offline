<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Powder Game - 本地版</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      background: #ece4d1;
      color: #241b13;
    }

    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 0.75rem;
    }

    h1, p {
      margin: 0;
    }

    main {
      width: min(100%, 400px);
      text-align: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 400 / 456;
      image-rendering: pixelated;
      touch-action: none;
    }

    #game:fullscreen {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 1rem;
      display: grid;
      place-content: center;
      background: #ece4d1;
    }

    #game:fullscreen canvas {
      width: min(100%, 400px);
      max-height: calc(100vh - 5rem);
    }

    button {
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }

    select {
      padding: 0.4rem;
    }

    .credit {
      font-size: 0.8rem;
      color: #514538;
    }
  </style>
</head>
<body>
  <h1>Powder Game</h1>
  <p>本地运行，无需联网。点击或拖动鼠标开始游玩。</p>
  <main id="game">
    <label for="version">版本：</label>
    <select id="version">
      <option value="standard">标准版（20,000／30,000／40,000）</option>
      <option value="extended">扩展版（60,000／90,000／120,000）</option>
    </select>
    <canvas id="cv" width="400" height="456" aria-label="Powder Game simulation"></canvas>
    <button id="fullscreen" type="button">全屏</button>
  </main>
  <p class="credit">Powder Game © 2007 ha55ii / DAN-BALL</p>
  <a href="https://github.com/isHuaMouRen/Powder-Game-Offline" class="credit">https://github.com/isHuaMouRen/Powder-Game-Offline</a>
  <script>
    const versionSelect = document.getElementById("version");
    const params = new URLSearchParams(window.location.search);
    const version = params.get("version") === "extended" ? "extended" : "standard";
    versionSelect.value = version;
    versionSelect.addEventListener("change", function () {
      params.set("version", versionSelect.value);
      window.location.search = params.toString();
    });

    const gameScript = document.createElement("script");
    gameScript.src = version === "extended"
      ? "./javagame/dust/dust-unlimited.js"
      : "./javagame/dust/dust.js";
    gameScript.onload = function () {
      // The authorized offline copy should not be blocked by the original domain check.
      window.zb = function () {
        window.Ob = 0;
        window.zf = 11;
        return false;
      };
      Init("", 1, "");
    };
    gameScript.onerror = function () {
      document.getElementById("game").insertAdjacentText("beforeend", " 游戏脚本加载失败。");
    };
    document.body.appendChild(gameScript);

    document.getElementById("fullscreen").addEventListener("click", async function () {
      const game = document.getElementById("game");
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else if (game.requestFullscreen) {
        await game.requestFullscreen();
      }
    });
  </script>
</body>
</html>
